services:
  master:
    container_name: mysql-master
    image: mysql:8.4.2
    ports:
      - 3306:3306
    volumes:
      - ./mysql/master/conf.cnf:/etc/my.cnf
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: QuizQueue
      MYSQL_USER: replication_user
      MYSQL_PASSWORD: 123
    command: [ "mysqld",
               "--server-id=1",
               "--log-bin=mysql-bin-1.log",
               "--binlog-format=row",
                "--mysql-native-password=ON"]

  slave:
    container_name: mysql-slave
    image: mysql:8.4.2
    ports:
      - 3307:3306
    volumes:
      - ./mysql/slave/conf.cnf:/etc/my.cnf
    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: QuizQueue
      MYSQL_USER: replication_user
      MYSQL_PASSWORD: 123
    command: [ "mysqld",
               "--server-id=2",
               "--log-bin=mysql-bin-2.log",
               "--binlog-format=row"]
    depends_on:
      - master

  zookeeper1:
    container_name: zookeeper1
    image: bitnami/zookeeper:latest
    ports:
      - "2181:2181"
      - "2888:2888"
      - "3888:3888"
      - "8078:8078"
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    networks:
      - private

  kafka:
    container_name: kafka
    image: bitnami/kafka:latest
    ports:
      - "9092:9092"
      - "29092:29092"
      - "9999:9999"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper1
    networks:
      - private

  zoonavigator:
    container_name: zoonavigator
    image: elkozmon/zoonavigator:latest
    environment:
      - HTTP_PORT=9000
    ports:
      - "9000:9000"
    restart: unless-stopped
    networks:
      - private

  nginx:
    container_name: nginx
    image: nginx:stable-alpine-slim
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    environment:
      - NGINX_HOST=foobar.com
      - NGINX_PORT=80

  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    volumes:
      - ./elasticsearch/elastic.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    environment:
      ELASTIC_PASSWORD: 123
    ports:
      - 9200:9200
    networks:
      - es-net

  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:8.15.0
    volumes:
      - ./elasticsearch/kibana.yml:/usr/share/kibana/config/kibana.yml
    ports:
      - 5601:5601
    networks:
      - es-net


  configuration:
    container_name: configuration
    build:
      context: ./Configuration
      dockerfile: Dockerfile
    ports:
      - 8888:8888
    networks:
      - private
      - public

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4-alpine
    environment:
      - RABBITMQ_DEFAULT_PASS=123
      - RABBITMQ_DEFAULT_USER=rabbitmq
    ports:
      - 5672:5672

networks:
  private:
    external: true
  public:
    external: true
  es-net:
    driver: bridge
